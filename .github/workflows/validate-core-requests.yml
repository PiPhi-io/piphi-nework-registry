name: Validate Core Plugin Requests

on:
  pull_request:
    paths:
      - "requests/**/*.json"
      - "registry.json"
      - "scripts/validate_request_files.py"
      - "scripts/submission_utils.py"

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-core-requests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate request files
        id: validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/validate_request_files.py

      - name: Comment on pull request
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = "<!-- piphi-core-request-validation -->";
            const passed = "${{ steps.validate.outcome }}" === "success";
            const body = [
              marker,
              `## Core Plugin Request Validation ${passed ? "Passed" : "Failed"}`,
              "",
              passed
                ? "Request files passed automated validation. A maintainer can review or promote the request."
                : "Request validation failed. Open the workflow logs for the exact errors.",
            ].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
