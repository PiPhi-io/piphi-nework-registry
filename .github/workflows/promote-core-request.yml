name: Promote Core Plugin Request

run-name: Promote Core request (${{ inputs.request_path }})

on:
  workflow_dispatch:
    inputs:
      request_path:
        description: Path to a validated requests/*.json file
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: promote-core-request-${{ github.event.repository.full_name }}-${{ inputs.request_path }}
  cancel-in-progress: false

jobs:
  promote-request:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Require default branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "${{ github.event.repository.default_branch }}" ]]; then
            echo "Request promotion must be triggered from ${{ github.event.repository.default_branch }}." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate request before promotion
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/validate_request_files.py "${{ inputs.request_path }}"

      - name: Promote request into registry
        id: promote
        env:
          GITHUB_TOKEN: ${{ secrets.REGISTRY_SOURCE_GITHUB_TOKEN != '' && secrets.REGISTRY_SOURCE_GITHUB_TOKEN || github.token }}
        run: |
          python scripts/promote_request.py \
            --request-path "${{ inputs.request_path }}" \
            --registry-path registry.json

      - name: Validate generated registry
        run: |
          python -m json.tool registry.json >/dev/null
          python scripts/validate_registry.py registry.json
          python scripts/validate_request_files.py "${{ inputs.request_path }}" --skip-remote

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            registry.json
            ${{ inputs.request_path }}
          branch: automation/promote-${{ steps.promote.outputs.registry_id }}
          delete-branch: true
          commit-message: ${{ steps.promote.outputs.commit_message }}
          title: ${{ steps.promote.outputs.pr_title }}
          body: |
            Promotes Core plugin request `${{ inputs.request_path }}` into `registry.json`.

            Generated entry:
            - Registry ID: `${{ steps.promote.outputs.registry_id }}`
            - Version: `${{ steps.promote.outputs.version }}`
            - Source ref: `${{ steps.promote.outputs.source_ref }}`

            This PR was generated by the registry request promotion workflow.

      - name: Report pull request
        shell: bash
        run: |
          if [[ -n "${{ steps.cpr.outputs.pull-request-url }}" ]]; then
            echo "Pull request: ${{ steps.cpr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pull request action ran but did not return a PR URL." >> "$GITHUB_STEP_SUMMARY"
          fi
