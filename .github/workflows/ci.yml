name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m json.tool registry.json >/dev/null
      - run: python scripts/validate_registry.py registry.json
      - run: python -m py_compile scripts/*.py
